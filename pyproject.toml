[project]
name = "thingsboard-automation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "playwright>=1.62.0",
    "pytest>=9.1.1",
    "pytest-html>=4.2.0",
    "pytest-playwright>=0.9.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
]

[project.scripts]
thingsboard-automation = "thingsboard_automation:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
